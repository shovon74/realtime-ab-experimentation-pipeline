services:
  # ---------------------------------------------------------------------------
  # 1. Apache Kafka 3.7.1 (KRaft Mode - No ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: exp-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Kafka Topic Initialization (exposures & conversions, 3 partitions each)
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: exp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $${KAFKA_TOPIC_EXPOSURES:-exposures} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $${KAFKA_TOPIC_CONVERSIONS:-conversions} --partitions 3 --replication-factor 1
        echo "Kafka topics initialized:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  # ---------------------------------------------------------------------------
  # 3. Synthetic Experimentation Event Producer (Python 3.11)
  # ---------------------------------------------------------------------------
  producer:
    image: python:3.11-slim
    container_name: exp-producer
    working_dir: /app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./producer:/app/producer:ro
      - ./.env:/app/.env:ro
    command: >
      sh -c "pip install --no-cache-dir kafka-python-ng==2.2.3 python-dotenv==1.0.1 &&
             python -m producer.producer"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Spark 3.5 Structured Streaming Consumer
  # ---------------------------------------------------------------------------
  spark-streaming:
    image: apache/spark:3.5.1-python3
    container_name: exp-spark-streaming
    user: root
    working_dir: /opt/pipeline
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:-kafka:29092}
      SPARK_DRIVER_MEMORY: 1g
      PYTHONPATH: /opt/pipeline
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./spark:/opt/pipeline/spark:ro
      - ./producer:/opt/pipeline/producer:ro
      - ./lake:/opt/pipeline/lake
      - ./checkpoints:/opt/pipeline/checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master ${SPARK_MASTER_URL:-local[2]}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      --conf spark.driver.extraJavaOptions="-Duser.home=/tmp"
      --conf spark.jars.ivy=/tmp/.ivy2
      /opt/pipeline/spark/streaming_job.py
    restart: unless-stopped
